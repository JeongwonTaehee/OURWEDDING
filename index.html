<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">

  <!-- Meta / OG tags - config.js 값으로 script에서 동적 설정 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="🤵🏻태쁘 💘 👰🏻‍♀️져너니 결혼합니다.">
  <meta property="og:description" content="2026년 12월 12일, 소중한 분들을 초대합니다.">
  <meta property="og:image" content="https://JeongwonTaehee.github.io/OURWEDDING/images/og/1.jpg">
  <meta name="description" content="">

  <title>Wedding Invitation</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>

  <!-- Firebase 방명록 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBH2pYUpolGp6-b21J5u1Va8SDYTCkFhcE",
      authDomain: "wedding-guestbook-49fd3.firebaseapp.com",
      projectId: "wedding-guestbook-49fd3",
      storageBucket: "wedding-guestbook-49fd3.firebasestorage.app",
      messagingSenderId: "314351845102",
      appId: "1:314351845102:web:a86169a0b3e2b5ace1fdff"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener("DOMContentLoaded", () => {
      const listEl = document.getElementById("guestbookList");
      const openBtn = document.getElementById("openWriterBtn");
      const closeBtn = document.getElementById("closeWriterBtn");
      const modal = document.getElementById("guestbookModal");
      const form = document.getElementById("guestbookForm");
      const loadMoreBtn = document.getElementById("loadMoreBtn");

      let displayLimit = 5;

      if (openBtn) openBtn.addEventListener("click", () => modal.classList.add("is-open"));
      if (closeBtn) closeBtn.addEventListener("click", () => modal.classList.remove("is-open"));
      if (modal) {
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.classList.remove("is-open");
        });
      }

      async function loadGuestbook() {
        if (!listEl) return;
        listEl.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">불러오는 중...</div>';
        try {
          const q = query(collection(db, "guestbook"), orderBy("createdAt", "desc"), limit(displayLimit));
          const querySnapshot = await getDocs(q);
          
          listEl.innerHTML = "";
          if (querySnapshot.empty) {
            listEl.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">아직 작성된 방명록이 없습니다.</div>';
            if (loadMoreBtn) loadMoreBtn.style.display = "none";
            return;
          }

          querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const dateStr = data.createdAt ? new Date(data.createdAt.toDate()).toISOString().slice(2, 16).replace(/-/g, "-").replace("T", " ") : "";
            
            const card = document.createElement("div");
            card.className = "guestbook-card";
            card.innerHTML = `
              <div class="guestbook-card__header">
                <span class="guestbook-card__name">${escapeHtml(data.name || '')}</span>
                <button class="guestbook-card__delete" data-id="${docSnap.id}">&times;</button>
              </div>
              <div class="guestbook-card__message">${escapeHtml(data.message || '')}</div>
              <div class="guestbook-card__date">${dateStr}</div>
            `;
            listEl.appendChild(card);
          });

          if (loadMoreBtn) {
            loadMoreBtn.style.display = querySnapshot.size >= displayLimit ? "block" : "none";
          }
        } catch (err) {
          console.error(err);
          listEl.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">방명록을 불러오지 못했습니다.</div>';
        }
      }

      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("writerName").value.trim();
          const password = document.getElementById("writerPassword").value.trim();
          const message = document.getElementById("writerMessage").value.trim();

          try {
            await addDoc(collection(db, "guestbook"), {
              name,
              password,
              message,
              createdAt: new Date()
            });
            alert("방명록이 등록되었습니다.");
            form.reset();
            modal.classList.remove("is-open");
            loadGuestbook();
          } catch (err) {
            alert("등록에 실패했습니다.");
          }
        });
      }

      if (listEl) {
        listEl.addEventListener("click", async (e) => {
          if (e.target.classList.contains("guestbook-card__delete")) {
            const id = e.target.dataset.id;
            const password = prompt("작성 시 입력한 비밀번호를 입력하세요:");
            if (!password) return;

            try {
              const docRef = doc(db, "guestbook", id);
              const docSnap = await getDoc(docRef);
              if (docSnap.exists() && docSnap.data().password === password) {
                await deleteDoc(docRef);
                alert("삭제되었습니다.");
                loadGuestbook();
              } else {
                alert("비밀번호가 일치하지 않습니다.");
              }
            } catch (err) {
              alert("삭제 중 오류가 발생했습니다.");
            }
          }
        });
      }

      if (loadMoreBtn) {
        loadMoreBtn.addEventListener("click", () => {
          displayLimit += 5;
          loadGuestbook();
        });
      }

      function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      }

      loadGuestbook();
    });
  </script>
</head>
<body>

  <!-- ─── Curtain (Simple Overlay) ─── -->
  <div id="curtain" class="curtain">
    <div class="curtain__content">
      <p class="curtain__names" id="curtainNames"></p>
      <button class="curtain__btn" id="curtainBtn">열기</button>
    </div>
  </div>

  <!-- ─── Toast Notification ─── -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- ─── Photo Viewer Modal ─── -->
  <div id="photoModal" class="photo-modal" role="dialog" aria-modal="true" aria-label="사진 보기">
    <button class="photo-modal__close" id="modalClose" aria-label="닫기">&times;</button>
    <button class="photo-modal__nav photo-modal__nav--prev" id="modalPrev" aria-label="이전 사진">&#8249;</button>
    <button class="photo-modal__nav photo-modal__nav--next" id="modalNext" aria-label="다음 사진">&#8250;</button>
    <div class="photo-modal__container" id="modalContainer">
      <img class="photo-modal__img" id="modalImg" src="" alt="사진" draggable="false">
    </div>
    <div class="photo-modal__counter" id="modalCounter"></div>
  </div>

  <!-- ─── Main Content ─── -->
  <main id="mainContent" class="main-content">

    <!-- Hero Section -->
    <section class="section hero" id="hero">
      <div class="hero__photo-wrap">
        <img class="hero__photo" id="heroPhoto" src="" alt="웨딩 사진" loading="eager">
      </div>
      <div class="hero__content">
        <h1 class="hero__names animate-item" data-animate="fade-up" id="heroNames"></h1>
        <p class="hero__date animate-item" data-animate="fade-up" id="heroDate"></p>
        <p class="hero__venue animate-item" data-animate="fade-up" id="heroVenue"></p>
      </div>

      <!-- Countdown -->
      <div class="countdown animate-item" data-animate="fade-up" id="countdown">
        <p class="countdown__label" id="countdownLabel"></p>
        <div class="countdown__timer">
          <div class="countdown__item">
            <span class="countdown__number" id="countDays">0</span>
            <span class="countdown__unit">일</span>
          </div>
          <div class="countdown__sep">:</div>
          <div class="countdown__item">
            <span class="countdown__number" id="countHours">0</span>
            <span class="countdown__unit">시간</span>
          </div>
          <div class="countdown__sep">:</div>
          <div class="countdown__item">
            <span class="countdown__number" id="countMinutes">0</span>
            <span class="countdown__unit">분</span>
          </div>
          <div class="countdown__sep">:</div>
          <div class="countdown__item">
            <span class="countdown__number" id="countSeconds">0</span>
            <span class="countdown__unit">초</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Greeting Section -->
    <section class="section greeting" id="greeting">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up" id="greetingTitle"></h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        <p class="greeting__text animate-item" data-animate="fade-up" id="greetingContent"></p>
        <div class="greeting__parents animate-item" data-animate="fade-up" id="greetingParents"></div>
      </div>
    </section>
    
    <!-- Story Section -->
    <section class="section story" id="story">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up" id="storyTitle"></h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        <p class="story__text animate-item" data-animate="fade-up" id="storyContent"></p>
        <div class="story__photos" id="storyPhotos"></div>
      </div>
    </section>

    <!-- Gallery Section -->
    <section class="section gallery" id="gallery">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">갤러리</h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        <div class="gallery__grid" id="galleryGrid"></div>
      </div>
    </section>

    <!-- Location Section -->
    <section class="section location" id="location">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">오시는 길</h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        <div class="location__info animate-item" data-animate="fade-up">
          <p class="location__venue" id="locationVenue"></p>
          <p class="location__hall" id="locationHall"></p>
          <p class="location__address" id="locationAddress"></p>
          <p class="location__tel" id="locationTel"></p>
        </div>
        <button class="btn btn--text location__copy animate-item" data-animate="fade-up" id="copyAddressBtn">주소 복사</button>
        <div class="location__map animate-item" data-animate="fade-in">
          <img class="location__map-img" id="locationMapImg" src="" alt="약도" loading="lazy">
        </div>
        <div class="location__links animate-item" data-animate="fade-up">
          <a class="btn btn--outline" id="kakaoMapBtn" href="#" target="_blank" rel="noopener">카카오맵</a>
          <a class="btn btn--outline" id="naverMapBtn" href="#" target="_blank" rel="noopener">네이버지도</a>
        </div>
      </div>
    </section>

    <!-- Calendar Actions -->
    <section class="section calendar-section" id="calendarSection">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">예식 일시</h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        <div class="calendar animate-item" data-animate="fade-up" id="calendarGrid"></div>
        <div class="calendar-actions animate-item" data-animate="fade-up">
          <a class="btn btn--outline" id="googleCalBtn" href="#" target="_blank" rel="noopener">Google 캘린더</a>
          <button class="btn btn--outline" id="icsDownloadBtn">Apple 캘린더</button>
        </div>
      </div>
    </section>

    <!-- Account Section (축의금) -->
    <section class="section account" id="account">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">마음 전하실 곳</h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
       <p class="account__desc animate-item" data-animate="fade-up" id="accountDescription"></p>

        <!-- Groom Accounts -->
        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="groomAccordion" aria-expanded="false">
            <span>신랑측 계좌번호</span>
            <span class="accordion__arrow">&#8964;</span>
          </button>
          <div class="accordion__panel" id="groomAccordionPanel">
            <div class="accordion__panel-inner" id="groomAccountList"></div>
          </div>
        </div>

        <!-- Bride Accounts -->
        <div class="accordion animate-item" data-animate="fade-up">
          <button class="accordion__trigger" id="brideAccordion" aria-expanded="false">
            <span>신부측 계좌번호</span>
            <span class="accordion__arrow">&#8964;</span>
          </button>
          <div class="accordion__panel" id="brideAccordionPanel">
            <div class="accordion__panel-inner" id="brideAccountList"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Notice Section (안내사항) -->
    <section class="section notice" id="notice">
      <div class="section__inner">
        <h2 class="section__title animate-item" data-animate="fade-up">안내사항</h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        <div class="notice__content animate-item" data-animate="fade-up" id="noticeCard"></div>
      </div>
    </section>

    <!-- Guest Book Section (방명록) -->
    <section class="section guestbook" id="guestbook">
      <div class="section__inner">
        <div style="text-align: center; font-size: 0.8rem; letter-spacing: 2px; color: #888; margin-bottom: 4px;">GUEST BOOK</div>
        <h2 class="section__title animate-item" data-animate="fade-up">방명록</h2>
        <div class="section__divider animate-item" data-animate="fade-in"></div>
        
        <!-- 방명록 리스트 영역 -->
        <div class="guestbook__list" id="guestbookList">
          <!-- 동적으로 카드가 생성됩니다 -->
        </div>

        <!-- 버튼 영역 -->
        <div class="guestbook__actions" style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
          <button class="guestbook__btn guestbook__btn--primary" id="openWriterBtn">작성하기</button>
          <button class="guestbook__btn guestbook__btn--outline" id="loadMoreBtn" style="display: none;">더 보기</button>
        </div>
      </div>
    </section>

    <!-- 방명록 작성 모달 -->
    <div class="modal" id="guestbookModal" style="display: none;">
      <div class="modal__container" style="background: #fff; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0; font-size: 1.1rem;">방명록 작성</h3>
          <button id="closeWriterBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        <form id="guestbookForm">
          <div style="margin-bottom: 12px;">
            <input type="text" id="writerName" required placeholder="이름" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
          </div>
          <div style="margin-bottom: 12px;">
            <input type="password" id="writerPassword" required placeholder="비밀번호 (삭제 시 필요)" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
          </div>
          <div style="margin-bottom: 16px;">
            <textarea id="writerMessage" rows="4" required placeholder="따뜻한 축하의 메시지를 남겨주세요." style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; resize: none;"></textarea>
          </div>
          <button type="submit" style="width: 100%; padding: 12px; background: #000; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">등록하기</button>
        </form>
      </div>
    </div>
      
    <!-- Footer -->
    <footer class="footer">
      <p class="footer__text" id="footerText"></p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
